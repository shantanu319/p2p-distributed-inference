[package]
name = "latticed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
clap = { version = "4.6.6", features = ["derive"] }
lattice-engine = { workspace = true, features = ["candle"] }
lattice-net.workspace = true
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "process", "signal"] }

[dev-dependencies]
tempfile = "3"
