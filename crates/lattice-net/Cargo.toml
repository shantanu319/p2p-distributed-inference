[package]
name = "lattice-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "rand_core", "pem"] }
hex = "0.4.3"
mdns-sd = "0.21.0"
postcard = "1.1.3"
quinn = { version = "0.11.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring", "bloom"] }
rand = "0.10.2"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spake2 = "0.4.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
