[package]
name = "lattice-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "rand_core", "pem"] }
hex = "0.4.3"
async-trait = "0.1"
hmac = "0.13.0"
lattice-engine.workspace = true
mdns-sd = "0.21.0"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = { version = "0.11.11", default-features = false, features = ["log", "runtime-tokio", "rustls-ring", "bloom"] }
rand = "0.10.2"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spake2 = "0.4.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
x509-parser = "0.18.1"

[dev-dependencies]
async-trait = "0.1"
lattice-engine.workspace = true
postcard = { version = "1.1.3", features = ["alloc"] }
tempfile = "3.27.0"
