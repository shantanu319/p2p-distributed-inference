[package]
name = "lattice-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
directories = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "rand_core", "pem"] }
hex = "0.4.3"
mdns-sd = "0.21.0"
postcard = "1.1.3"
quinn = "0.11.11"
rand = "0.10.2"
rcgen = "0.14.9"
rustls = "0.23.43"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
spake2 = "0.4.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1.44"
